name: Release v0.1.0

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            command: npm run dist:linux
            artifact: linux
          - os: windows-latest
            command: npm run dist:windows
            artifact: windows
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: ${{ matrix.command }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: clipshelf-${{ matrix.artifact }}
          path: |
            release/*.AppImage
            release/*Setup.exe
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: clipshelf-*
          merge-multiple: true
          path: artifacts
      - name: Create checksums
        run: sha256sum artifacts/* > artifacts/SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v0.1.0 artifacts/* \
            --repo "${{ github.repository }}" \
            --title 'ClipShelf v0.1.0' \
            --notes 'First release of ClipShelf for Linux and Windows.'
